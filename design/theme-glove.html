<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChoreWars: Glove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  :root { --bg: #0C0C0B; --card: #191917; --ink: #ECEAE0; --soft: #B5B2A8; --mute: #8B897F; --acc: #D8F23A; --on: #10100E; --due: #FF7A4D; }
  body { background: #2a2a28; color: #e8e6df; font: 15px/1.5 "Instrument Sans", "Segoe UI", sans-serif; padding: 40px 24px 80px; }
  .page { max-width: 1240px; margin: 0 auto; }
  .page > h1 { font: 600 30px/1.1 "Bricolage Grotesque", "Segoe UI", sans-serif; letter-spacing: -.02em; }
  .page > p { max-width: 64ch; margin-top: 8px; color: #a9a79e; }
  .row { display: flex; flex-wrap: wrap; gap: 40px 36px; margin-top: 36px; justify-content: center; }
  .col { width: 372px; }
  .col h2 { font: 600 20px/1.2 "Bricolage Grotesque", sans-serif; letter-spacing: -.01em; }
  .col .tag { font: 500 12px "IBM Plex Mono", Consolas, monospace; color: #8f8d84; margin-bottom: 14px; }
  .notes { margin-top: 14px; font-size: 14px; color: #b9b7ae; }
  .notes li { margin: 5px 0 5px 18px; }
  .replay { margin-top: 12px; font: 500 12px "IBM Plex Mono", monospace; background: none; border: 1px solid #6b6a63; border-radius: 4px; padding: 6px 10px; cursor: pointer; color: #b9b7ae; }
  button { font: inherit; cursor: pointer; }

  .phone { width: 372px; height: 760px; border-radius: 44px; border: 9px solid #050505; overflow: hidden; position: relative; box-shadow: 0 24px 50px -22px rgba(0,0,0,.8); }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); }
  .body { flex: 1; overflow: hidden; padding: 0 14px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; padding: 24px 6px 16px; }
  .top b { font: 700 21px "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; }
  .top span, .sec { font-size: 12.5px; color: var(--mute); }
  .sec { padding: 14px 6px 7px; font-weight: 500; }
  .card { position: relative; background: var(--card); border-radius: 18px; overflow: hidden; }
  .card > * { position: relative; z-index: 2; }
  .hero { padding: 18px; height: 188px; }
  .kick { font-size: 12.5px; font-weight: 600; color: var(--due); }
  .hero .n { font: 700 32px/1.1 "Bricolage Grotesque", sans-serif; letter-spacing: -.03em; margin-top: 2px; }
  .dek { font-size: 13.5px; margin-top: 4px; color: var(--soft); min-height: 41px; }
  .act { display: flex; align-items: center; gap: 16px; margin-top: 14px; }
  .btn { background: var(--acc); color: var(--on); border: 0; border-radius: 999px; height: 44px; padding: 0 22px; font-weight: 600; font-size: 14.5px; }
  .link { background: none; border: 0; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; color: var(--soft); }
  .li { display: flex; align-items: center; gap: 12px; padding: 11px 16px 11px 14px; margin-top: 6px; border-radius: 14px; }
  .li .n { flex: 1; font: 600 16.5px "Bricolage Grotesque", sans-serif; letter-spacing: -.01em; }
  .li .m { font-size: 12.5px; color: var(--mute); } .li .m.due { color: var(--due); }
  .li i { width: 4px; height: 22px; border-radius: 2px; background: var(--acc); flex: none; }
  .li i.mid { background: #6B6960; } .li i.due { background: var(--due); }
  .league { padding: 10px 16px; }
  .lg { display: flex; padding: 5px 0; font-size: 14px; }
  .lg span:nth-child(2) { flex: 1; } .lg span:first-child { width: 22px; opacity: .55; }
  .lg.me { color: var(--acc); font-weight: 600; }
  .nav { display: flex; justify-content: space-around; padding: 14px 10px 24px; font-size: 13px; font-weight: 500; color: #6E6B64; }
  .nav .on { color: var(--acc); }

  /* ── 1 · REFILL ── */
  .lv { position: absolute !important; inset: 0 auto 0 0; z-index: 1 !important; width: var(--w, 0%); background: rgba(216,242,58,.11); border-right: 2px solid var(--acc); }
  #R .hero .lv { background: var(--acc); border: 0; width: 0; }
  #R .li { padding-left: 16px; }
  #R.done .hero .lv { width: 100%; transition: width .9s cubic-bezier(.6,0,.2,1); }
  #R.done .hero, #R.done .hero .kick, #R.done .hero .dek { color: var(--on); transition: color .35s .3s; }
  #R.done .act { opacity: 0; pointer-events: none; transition: opacity .15s; }

  /* ── 2 · SLIDE ── */
  #S .flood { position: absolute !important; inset: 0; z-index: 1 !important; background: var(--acc); clip-path: circle(0 at 88% 150px); }
  #S .track { position: relative; margin-top: 14px; height: 48px; border-radius: 999px; background: #0C0C0B; display: flex; align-items: center; justify-content: center; font-size: 13.5px; font-weight: 500; color: var(--mute); user-select: none; overflow: hidden; }
  #S .trail { position: absolute; inset: 0 auto 0 0; width: 48px; border-radius: 999px; background: var(--acc); opacity: .28; }
  #S .knob { position: absolute; left: 0; top: 0; width: 48px; height: 48px; border-radius: 50%; background: var(--acc); cursor: grab; touch-action: none; display: grid; place-items: center; }
  #S .knob::after { content: ""; width: 9px; height: 9px; border: solid var(--on); border-width: 2.5px 2.5px 0 0; transform: translateX(-2px) rotate(45deg); }
  #S .track.auto .knob, #S .track.auto .trail { transition: all .7s cubic-bezier(.5,0,.2,1); }
  #S.done .flood { clip-path: circle(160% at 88% 150px); transition: clip-path .8s cubic-bezier(.5,0,.2,1); }
  #S.done .hero, #S.done .hero .kick, #S.done .hero .dek { color: var(--on); transition: color .3s .25s; }
  #S.done .track { opacity: 0; transition: opacity .25s .1s; pointer-events: none; }

  /* ── 3 · FLIP ── */
  #F .flipper { perspective: 900px; height: 188px; }
  #F .inner { position: relative; height: 100%; transform-style: preserve-3d; transition: transform .75s cubic-bezier(.5,0,.2,1.1); }
  #F .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  #F .back { transform: rotateX(180deg); background: var(--acc); color: var(--on); padding: 18px; border-radius: 18px; display: flex; flex-direction: column; justify-content: space-between; }
  #F .back .kick, #F .back .dek { color: var(--on); min-height: 0; }
  #F .back .big { display: flex; align-items: flex-end; justify-content: space-between; }
  #F .back .n { font: 700 32px/1.1 "Bricolage Grotesque", sans-serif; letter-spacing: -.03em; }
  #F .back .pts { font: 700 56px/.9 "Bricolage Grotesque", sans-serif; letter-spacing: -.04em; }
  #F.done .inner { transform: rotateX(180deg); }
</style>
</head>
<body>
<div class="page">
  <h1>ChoreWars: Glove, three ways to finish</h1>
  <p>Same black, chalk and rubber-glove yellow in all three, no dust. The difference is how a card shows its state and what happens when you finish. In every one, the card ends up yellow, not black.</p>
  <div class="row" id="row"></div>
</div>

<script>
  const rows = {
    R: `<div class="card li"><span class="n">Balcony</span><span class="m due">Arjun's turn · 6d</span></div>
        <div class="card li" style="--w:38%"><div class="lv"></div><span class="n">Living room</span><span class="m">3d</span></div>
        <div class="card li" style="--w:66%"><div class="lv"></div><span class="n">Hallway</span><span class="m">2d</span></div>
        <div class="card li" style="--w:88%"><div class="lv"></div><span class="n">Bathroom</span><span class="m">1d</span></div>`,
    strip: `<div class="card li"><i class="due"></i><span class="n">Balcony</span><span class="m due">Arjun's turn · 6d</span></div>
        <div class="card li"><i class="mid"></i><span class="n">Living room</span><span class="m">3d</span></div>
        <div class="card li"><i></i><span class="n">Hallway</span><span class="m">2d</span></div>
        <div class="card li"><i></i><span class="n">Bathroom</span><span class="m">1d</span></div>`,
  };
  const front = (action) => `
    <div class="kick" data-done="Clean, just now">Your turn</div>
    <div class="n">Kitchen</div>
    <div class="dek" data-done="Ten points to you. Arjun is up next.">Priya flagged it 2h ago. Last cleaned 4 days ago.</div>
    ${action}`;
  const heroes = {
    R: `<div class="card hero"><div class="lv"></div>${front(`<div class="act"><button class="btn" onclick="done('R')">Mark clean</button><button class="link">Looks fine to me</button></div>`)}</div>`,
    S: `<div class="card hero"><div class="flood"></div>${front(`<div class="track" id="track"><div class="trail"></div>Slide to clean<div class="knob" id="knob"></div></div>`)}</div>`,
    F: `<div class="flipper"><div class="inner">
          <div class="card hero face">${front(`<div class="act"><button class="btn" onclick="done('F')">Mark clean</button><button class="link">Looks fine to me</button></div>`).replace(/ data-done="[^"]*"/g, '')}</div>
          <div class="face back"><div><div class="kick">Clean, just now</div><div class="dek">Arjun is up next for the kitchen.</div></div><div class="big"><span class="n">Kitchen</span><span class="pts">+10</span></div></div>
        </div></div>`,
  };
  const themes = [
    { id: 'R', title: '1 · Refill', tag: 'cards are freshness meters', rows: rows.R, notes: [
      'Every card carries a yellow level that slowly runs down after a clean. Full means fresh, empty means it needs doing.',
      '<b>Done:</b> yellow pours back across the card until it is full.' ] },
    { id: 'S', title: '2 · Slide', tag: 'you do the wipe yourself', rows: rows.strip, notes: [
      'No button. Drag the yellow knob across the card to mark it clean (or just click the knob here).',
      '<b>Done:</b> yellow floods out from where your thumb lands. Also makes accidental taps impossible.' ] },
    { id: 'F', title: '3 · Flip', tag: 'the card turns over', rows: rows.strip, notes: [
      'Plain cards with a small status strip: yellow clean, grey getting on, coral due.',
      '<b>Done:</b> the card flips over to a yellow back showing the points you earned.' ] },
  ];
  document.getElementById('row').innerHTML = themes.map(t => `
    <div class="col">
      <h2>${t.title}</h2><div class="tag">${t.tag}</div>
      <div class="phone"><div class="screen" id="${t.id}">
        <div class="body">
          <div class="top"><b>Flat 4B</b><span>Round 6 · 42 pts · 2nd</span></div>
          ${heroes[t.id]}
          <div class="sec">The house</div>
          ${t.rows}
          <div class="sec">This round</div>
          <div class="card league">
            <div class="lg"><span>1</span><span>Priya</span><span>58</span></div>
            <div class="lg me"><span>2</span><span>Thomas</span><span data-done="52">42</span></div>
            <div class="lg"><span>3</span><span>Arjun</span><span>31</span></div>
          </div>
        </div>
        <div class="nav"><span class="on">Home</span><span>Areas</span><span>League</span><span>Stock</span><span>You</span></div>
      </div></div>
      <button class="replay" onclick="reset('${t.id}')">reset</button>
      <ul class="notes">${t.notes.map(n => `<li>${n}</li>`).join('')}</ul>
    </div>`).join('');

  const timers = {}, swap = { R: 450, S: 300, F: 350 };
  function done(id) {
    const el = document.getElementById(id);
    if (el.classList.contains('done')) return;
    el.classList.add('done');
    timers[id] = setTimeout(() => el.querySelectorAll('[data-done]').forEach(n => { n.dataset.orig = n.innerHTML; n.innerHTML = n.dataset.done; }), swap[id]);
  }
  function reset(id) {
    clearTimeout(timers[id]);
    const el = document.getElementById(id);
    el.classList.remove('done');
    el.querySelectorAll('[data-orig]').forEach(n => { n.innerHTML = n.dataset.orig; delete n.dataset.orig; });
    if (id === 'S') setKnob(0, true);
  }

  // slide-to-clean
  const track = document.getElementById('track'), knob = document.getElementById('knob'), trail = track.querySelector('.trail');
  let startX = null, moved = false;
  const max = () => track.clientWidth - 48;
  function setKnob(x, animate) {
    track.classList.toggle('auto', !!animate);
    knob.style.left = x + 'px'; trail.style.width = (x + 48) + 'px';
  }
  knob.addEventListener('pointerdown', e => { startX = e.clientX; moved = false; knob.setPointerCapture(e.pointerId); track.classList.remove('auto'); });
  knob.addEventListener('pointermove', e => {
    if (startX === null) return;
    const x = Math.max(0, Math.min(max(), e.clientX - startX));
    if (x > 4) moved = true;
    setKnob(x);
  });
  knob.addEventListener('pointerup', e => {
    if (startX === null) return;
    const x = parseFloat(knob.style.left) || 0; startX = null;
    if (!moved) { setKnob(max(), true); setTimeout(() => done('S'), 650); }       // plain click: play it
    else if (x > max() * 0.85) { setKnob(max(), true); done('S'); }
    else setKnob(0, true);
  });

  if (location.hash === '#done') { ['R', 'F'].forEach(done); setKnob(max()); done('S'); }
</script>
</body>
</html>
